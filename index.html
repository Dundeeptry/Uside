<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson Electronics Registration Form</title>
    <style>
        body {
            background-color: #fff;
            font-family: "Times New Roman", Times, serif;
            color: #000;
            display: flex;
            justify-content: center;
            padding: 10px;
        }
        .container {
            width: 700px; 
            background-color: #9acdfd;
            padding: 0 55px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 720px;
        }
        .header-box {
            background-color: #00ffff;
            border: 2px solid #000;
            border-radius: 8px;
            width: fit-content;
            margin: 0 auto;
            text-align: center;
            font-weight: bold;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        .header-top {
            padding: 4px 35px 2px;
            border-bottom: 4px solid #000;
            font-size: 26px;
        }
        .header-bottom {
            padding: 2px 35px 4px;
            font-size: 26px;
        }
        h2 { text-align: center; margin: 8px 0 25px 0; font-size: 30px; }
        .subtitle { text-align: center; margin-bottom: 5px; font-size: 15px; }
        
        input[type="text"], select, textarea {
            border: inset 2px;
            padding: 2px 5px;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            box-shadow: inset 0 0 0 1px #4da6ff;
        }
        
        hr {
            border: none;
            border-top: 2px solid #000; 
            margin: 10px 0;
        }

        input[type="checkbox"] {
            margin-right: 5px;
            cursor: pointer;
            vertical-align: middle;
        }

        input[type="radio"] {
            -webkit-appearance: none;
            appearance: none;
            background-color: #fff;
            border: 1px solid #666;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            margin-right: 5px;
            position: relative;
            outline: none;
            cursor: pointer;
            vertical-align: middle;
            box-sizing: border-box;
        }

        input[type="radio"]:checked::before {
            content: "";
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #4CAF50;
            border: 1px solid #111;
        }

        textarea { 
            width: 97%;
            height: 100px; 
            resize: none; 
        }
        
        .buttons { text-align: center; margin: 0; }
        .buttons button {
            padding: 3px 12px;
            margin: 0 1px;
            font-size: 13px;
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #000;
            border: 1px solid #777;
            border-radius: 3px;
            cursor: pointer;
        }
        .buttons button:hover { background-color: #e6e6e6; }
        
        .form-table { width: 100%; border-collapse: collapse; }
        .form-table td { padding: 3px 0; vertical-align: top; }
        .label-col { width: 220px; font-size: 15px; padding-top: 5px; }
        
        .options-table { width: 100%; border-collapse: collapse; }
        .options-table td { padding: 2px 0; width: 50%; vertical-align: middle; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <div class="header-top">Jackson</div>
            <div class="header-bottom">Electronics</div>
        </div>

        <div>
            <h2>Registration Form</h2>
            <div class="subtitle">Register your Jackson Electronics product here</div>

            <table class="form-table">
                <tr>
                    <td class="label-col">First Name:</td>
                    <td>
                        <input type="text" name="first_name" style="width: 100px;">
                        <span>Last Name:</span>
                        <input type="text" name="last_name" style="width: 100px;">
                    </td>
                </tr>
                <tr>
                    <td class="label-col">Address #1:</td>
                    <td><input type="text" name="address1" style="width: 200px;"></td>
                </tr>
                <tr>
                    <td class="label-col">Address #2:</td>
                    <td><input type="text" name="address2" style="width: 200px;"></td>
                </tr>
                <tr>
                    <td class="label-col">City:</td>
                    <td>
                        <input type="text" name="city" style="width: 130px;">
                        <span>State:</span>
                        <input type="text" name="state" style="width: 35px;">
                        <span>Zip:</span>
                        <input type="text" name="zip" style="width: 55px;">
                    </td>
                </tr>
                <tr>
                    <td class="label-col">Country:</td>
                    <td><input type="text" name="country" value="United States" style="width: 130px;"></td>
                </tr>
                
                <tr><td colspan="2"><hr></td></tr>

                <tr>
                    <td class="label-col">Product:</td>
                    <td>
                        <select name="product" style="width: 160px;">
                            <option value="ScanMaster">ScanMaster</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label-col">Date Purchased:</td>
                    <td><input type="text" name="date_purchased" style="width: 130px;"></td>
                </tr>
                <tr>
                    <td class="label-col">Serial #:</td>
                    <td><input type="text" name="serial" style="width: 130px;"></td>
                </tr>
                <tr>
                    <td class="label-col">Used for:</td>
                    <td>
                        <table class="options-table">
                            <tr>
                                <td><label><input type="radio" name="used_for" value="Home"> Home</label></td>
                                <td><label><input type="radio" name="used_for" value="Educational Institution"> Educational Institution</label></td>
                            </tr>
                            <tr>
                                <td><label><input type="radio" name="used_for" value="Business" checked> Business</label></td>
                                <td><label><input type="radio" name="used_for" value="Other"> Other</label></td>
                            </tr>
                            <tr>
                                <td><label><input type="radio" name="used_for" value="Government"> Government</label></td>
                                <td></td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td class="label-col">System (check all that apply):</td>
                    <td>
                        <table class="options-table">
                            <tr>
                                <td><label><input type="checkbox" name="system" value="Windows"> Windows</label></td>
                                <td><label><input type="checkbox" name="system" value="UNIX"> UNIX</label></td>
                            </tr>
                            <tr>
                                <td><label><input type="checkbox" name="system" value="Macintosh"> Macintosh</label></td>
                                <td><label><input type="checkbox" name="system" value="Other"> Other</label></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr><td colspan="2"><hr></td></tr>

                <tr>
                    <td class="label-col">Comments?:</td>
                    <td><textarea name="comments"></textarea></td>
                </tr>
            </table>
        </div>

        <div class="buttons">
            <button type="button">Click to register</button>
            <button type="button">Click to cancel</button>
        </div>
    </div>

</body>
</html>
