<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manage your profile information and account settings."
    />
    <title>Bài 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="sidebar-nav">
          <a class="nav-item is-active" href="#" aria-label="Dashboard" aria-current="page">
            <img src="pic/vuesax/linear/element-4.svg" alt="" />
          </a>
          <a class="nav-item" href="#" aria-label="Analytics">
            <img src="pic/vuesax/linear/graph.svg" alt="" />
          </a>
          <a class="nav-item" href="#" aria-label="Achievements">
            <img src="pic/vuesax/linear/medal-star.svg" alt="" />
          </a>
          <a class="nav-item" href="#" aria-label="Messages">
            <img src="pic/vuesax/linear/messages.svg" alt="" />
          </a>
        </nav>

        <a class="nav-item sidebar-settings" href="#" aria-label="Settings">
          <img src="pic/vuesax/linear/setting-2.svg" alt="" />
        </a>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="page-heading">
            <h1>Welcome, Amanda</h1>
            <p>Tue, 07 June 2022</p>
          </div>

          <div class="topbar-actions">
            <label class="search-box">
              <img src="pic/vuesax/linear/search-normal.svg" alt="" />
              <input type="search" placeholder="Search" aria-label="Search" />
            </label>
            <button class="icon-button notification-button" type="button" aria-label="Notifications">
              <img src="pic/vuesax/linear/notification-bing.svg" alt="" />
            </button>
            <button class="user-avatar" type="button" aria-label="Open Amanda's account">
              <img src="pic/Rectangle 1072.png" alt="" />
            </button>
          </div>
        </header>

        <section class="profile-page" aria-label="Profile settings">
          <div class="banner" aria-hidden="true"></div>

          <section class="profile-card" aria-labelledby="profile-name">
            <div class="profile-intro">
              <div class="profile-person">
                <img
                  class="profile-photo"
                  src="pic/source/08f8792cc4560e6955e1cf3aa9aa4edfe7cc29bf.png"
                  alt="Alexa Rawles"
                />
                <div>
                  <h2 id="profile-name">Alexa Rawles</h2>
                  <p>alexa.rawles@gmail.com</p>
                </div>
              </div>
              <button class="edit-button" type="button">Edit</button>
            </div>

            <form class="profile-form">
              <div class="field-grid">
                <label class="field">
                  <span>First Name</span>
                  <input type="text" placeholder="Your First Name" />
                </label>
                <label class="field">
                  <span>Last Name</span>
                  <input type="text" placeholder="Your Last Name" />
                </label>
                <label class="field select-field">
                  <span>Gender</span>
                  <select aria-label="Gender">
                    <option value="" selected disabled>Your Gender</option>
                  </select>
                </label>
                <label class="field select-field">
                  <span>Country</span>
                  <select aria-label="Country">
                    <option value="" selected disabled>Your Country</option>
                  </select>
                </label>
                <label class="field select-field">
                  <span>Language</span>
                  <select aria-label="Language">
                    <option value="" selected disabled>Your Language</option>
                  </select>
                </label>
                <label class="field select-field">
                  <span>Time Zone</span>
                  <select aria-label="Time Zone">
                    <option value="" selected disabled>Your Time Zone</option>
                  </select>
                </label>
              </div>

              <section class="email-section" aria-labelledby="email-heading">
                <h3 id="email-heading">My email Address</h3>
                <div class="email-row">
                  <span class="email-icon" aria-hidden="true">
                    <img src="pic/vuesax/bold/sms.svg" alt="" />
                  </span>
                  <div class="email-details">
                    <p>alexa.rawles@gmail.com</p>
                    <span>1 month ago</span>
                  </div>
                </div>
                <button class="add-email" type="button">+ Add Email Address</button>
              </section>
            </form>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
